<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradients matching Tridaya's high-contrast theme -->
    <linearGradient id="powerIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="powerEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="powerCyan" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern smooth dark square container with high rounded corners -->
  <rect width="512" height="512" rx="144" fill="#090d16" />
  
  <!-- Subtle glowing ring around the logo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.6" />
  
  <!-- Tridaya (3-fold symmetry interlocking symbol) -->
  <g transform="translate(256, 256)" filter="url(#softGlow)">
    <!-- Blade 1 (Indigo) - Top/Left direction -->
    <path d="M 0,-150 C -90,-150 -130,-70 -130,0 C -130,50 -90,90 -40,90 C 10,90 20,40 0,0 C -15,-30 -15,-80 0,-110 Z" fill="url(#powerIndigo)" />
    
    <!-- Blade 2 (Emerald) - Bottom/Right direction, rotated 120 deg -->
    <g transform="rotate(120)">
      <path d="M 0,-150 C -90,-150 -130,-70 -130,0 C -130,50 -90,90 -40,90 C 10,90 20,40 0,0 C -15,-30 -15,-80 0,-110 Z" fill="url(#powerEmerald)" />
    </g>
    
    <!-- Blade 3 (Cyan) - Bottom/Left direction, rotated 240 deg -->
    <g transform="rotate(240)">
      <path d="M 0,-150 C -90,-150 -130,-70 -130,0 C -130,50 -90,90 -40,90 C 10,90 20,40 0,0 C -15,-30 -15,-80 0,-110 Z" fill="url(#powerCyan)" />
    </g>
    
    <!-- Luminous Central Nexus -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
